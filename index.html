<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Logger</title>
<!-- значок вкладки: синий квадрат с кривой мощности, встроен прямо в файл -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23176292'/%3E%3Cpolyline points='5,22 10,22 13,10 17,25 20,15 23,18 27,18' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='27' cy='18' r='2.4' fill='%23F16727'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /*
    Стили. Сначала цвета (светлая тема, затем тёмная — включается сама по настройке системы),
    дальше блоки в порядке страницы: шапка, раскладка, число, переключатели, запись, график,
    подвал, и в конце правила для узких окон.
  */
  :root {
    --bg: #F3F6F6;
    --panel: #FFFFFF;
    --line: #DCE3E4;
    --line-strong: #C3CDCF;
    --track: #E8EEEE;
    --text: #15181C;
    --text-2: #3D464E;
    --muted: #56616B;
    --btn-muted: #4A555E;
    --blue: #176292;
    --teal: #04979D;
    --teal-ink: #0B5E62;
    --orange: #F16727;
    --orange-ink: #9A3B0A;
    --red: #D01717;
    --primary: #176292;
    --seg-on: #FFFFFF;
    --field: #FFFFFF;
    --shadow: rgba(0,0,0,.12);
    --dot-off: #9AA5AE;
    --grid: #E8EEEE;
    --axis: #C3CDCF;
    --marker: #9AA5AE;
    --plot-line: #176292;
    --sans: 'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  /* тёмная тема — следует настройке системы/браузера */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131618;
      --panel: #1B1F22;
      --line: #2A3034;
      --line-strong: #3B4348;
      --track: #262B2F;
      --text: #E7EAEC;
      --text-2: #C3CACE;
      --muted: #98A3AB;
      --btn-muted: #ADB6BD;
      --blue: #5AA9DD;
      --teal: #2BC0C6;
      --teal-ink: #5ED3D8;
      --orange: #F47B42;
      --orange-ink: #F5A27A;
      --red: #F06060;
      --primary: #2272A8;
      --seg-on: #3A4247;
      --field: #15191B;
      --shadow: rgba(0,0,0,.4);
      --dot-off: #6B767E;
      --grid: #262C30;
      --axis: #3B4348;
      --marker: #6B767E;
      --plot-line: #5AA9DD;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); }
  button { font-family: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- шапка ---------- */
  header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 16px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  .conn { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; white-space: nowrap; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .status.off { color: var(--muted); }
  .status.off .dot { background: var(--dot-off); }
  .status.on { color: var(--teal-ink); }
  .status.on .dot { background: var(--teal); }
  .status.warn { color: var(--orange-ink); }
  .status.warn .dot { background: var(--orange); }

  .btn {
    height: 44px; padding: 0 16px; font-size: 14px; font-weight: 500; white-space: nowrap;
    background: var(--panel); color: var(--text); border: 1px solid var(--line-strong); border-radius: 8px;
  }
  .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* ---------- раскладка ---------- */
  main { flex: 1; display: flex; gap: 20px; padding: 20px 24px; }
  /* левая колонка: те же 20 px между карточками, что и до графика; карточки растянуты
     на высоту графика, содержимое — по центру карточки */
  .left { flex: 0 1 420px; min-width: 340px; display: flex; flex-direction: column; gap: 20px; }
  .left > .card { flex: 1 1 auto; justify-content: center; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card.readout { padding: 20px; }
  .chart-card { flex: 1 1 0; min-width: 0; padding: 16px 20px 18px; gap: 12px; container-type: inline-size; }

  .caps { font-size: 13px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .label { font-size: 15px; font-weight: 500; white-space: nowrap; }
  .hint { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
  .hint.notice { color: var(--orange-ink); font-weight: 600; }

  /* ---------- число ---------- */
  .value { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; overflow: hidden; }
  .num {
    font-family: var(--mono); font-size: 68px; font-weight: 500; line-height: 1; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; text-align: left; white-space: nowrap; flex-shrink: 0;
  }
  .num.idle { color: var(--text-2); font-weight: 300; }
  .value.idle { align-items: center; }     /* прочерки стоят посередине строки — единицы по их центру */
  .stale .num, .stale .unit { opacity: .35; }     /* значение устарело: данные перестали идти */
  /* зашкал: выход Nova упёрся в полную шкалу, настоящая мощность может быть больше */
  .over .num, .over .unit, .over .frac-head span:last-child { color: var(--red); }
  .over .bar > div { background: var(--red); }
  .unit { font-family: var(--mono); font-size: 26px; color: var(--text-2); flex-shrink: 0; }
  .icon-btn {
    width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    padding: 0; background: transparent; color: var(--btn-muted); border: none; border-radius: 8px;
  }
  .icon-btn:hover { background: var(--track); }
  .icon-btn.done { color: var(--teal); }

  .frac-head { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
  .frac-head span:last-child { font-family: var(--mono); white-space: nowrap; }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 6px; width: 0; min-width: 2px; background: var(--blue); border-radius: 3px; }

  /* ---------- переключатели ---------- */
  .seg { display: flex; background: var(--track); border-radius: 8px; padding: 3px; gap: 3px; flex-shrink: 0; }
  .seg button {
    height: 38px; min-width: 72px; padding: 0 12px; font-size: 15px; font-weight: 500; white-space: nowrap;
    background: transparent; color: var(--btn-muted); border: 1px solid transparent; border-radius: 6px;
  }
  .seg.mono button { font-family: var(--mono); }
  .seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px var(--shadow); }
  .ctl-label { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .seg button.draft[aria-pressed="true"] { outline: 1px dashed var(--blue); outline-offset: -1px; color: var(--blue); }

  /* ---------- range: число + единицы + ✓ ---------- */
  .range-row { display: flex; align-items: center; gap: 8px; }
  .range-row .seg button { min-width: 52px; }
  #rangeNum {
    flex: 1; min-width: 0; height: 44px; padding: 0 12px; font-family: var(--mono); font-size: 20px; text-align: right;
    border: 1px solid var(--line-strong); border-radius: 8px; color: var(--text); background: var(--field);
  }
  #rangeNum.draft { border: 1px dashed var(--blue); color: var(--blue); }   /* черновик, ещё не применён */
  #rangeNum.invalid { border: 1px solid var(--red); color: var(--red); }
  #applyBtn { width: 44px; height: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .pair { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }

  /* ---------- запись ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; color: var(--muted); }
  .file-row { display: flex; gap: 8px; align-items: center; }
  .file-row input {
    flex: 1; min-width: 0; height: 40px; padding: 0 12px; font-size: 14px; font-family: var(--mono);
    border: 1px solid var(--line-strong); border-radius: 8px; color: var(--text); background: var(--field);
    cursor: pointer;                                    /* поле только для показа: клик открывает выбор файла */
  }
  .file-row input.suggested { color: var(--muted); }   /* файл ещё не выбран: это предложенное имя */
  .file-row .btn { height: 40px; padding: 0 14px; }
  .rec-btn {
    height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 15px; font-weight: 600; background: var(--panel); color: var(--text); border: 1px solid var(--blue); border-radius: 8px;
  }
  .rec-btn .mark { width: 12px; height: 12px; border-radius: 50%; background: var(--orange); flex-shrink: 0; }
  .rec-btn.active { color: var(--red); border: 2px solid var(--red); }
  .rec-btn.active .mark { border-radius: 2px; background: var(--red); }

  /* ---------- график ---------- */
  .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; }
  .chart-tools { display: flex; align-items: center; gap: 12px 32px; }
  .plot { flex: 1; min-height: 420px; position: relative; }
  .plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .plot .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }

  /* узкая карточка графика: подпись сверху, пары переключателей — каждая своей строкой */
  @container (max-width: 700px) {
    .chart-head { flex-direction: column; align-items: stretch; }
    .chart-tools { flex-direction: column; align-items: stretch; gap: 10px; }
    .chart-tools .pair { justify-content: space-between; }
  }

  /* ---------- подвал ---------- */
  footer {
    display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 10px 24px; background: var(--panel);
    border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  footer .err { color: var(--red); }

  .banner { margin: 20px 24px 0; padding: 12px 16px; border-radius: 8px; background: var(--track); color: var(--orange-ink); font-size: 14px; }

  /* ---------- узкое окно: одна колонка — мощность, кнопки, график, запись ---------- */
  @media (max-width: 900px) {
    main { flex-direction: column; padding: 16px; gap: 16px; }
    .left { display: contents; }
    .card.readout { order: 1; }
    .card.controls { order: 2; }
    .chart-card { order: 3; flex: none; }
    .left > .card { flex: none; }
    .card.record { order: 4; }
    .plot { min-height: 320px; }
    header { padding: 12px 16px; }
    footer { padding: 10px 16px; }
  }
  @media (max-width: 480px) {
    #statusText { display: none; }      /* в узкой шапке остаётся только цветная точка */
    .status .dot { width: 10px; height: 10px; }
  }
  @media (max-height: 720px) and (min-width: 901px) {
    .plot { min-height: 320px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="title">
      <h1>Nova Logger</h1>
    </div>
    <div class="conn">
      <span id="status" class="status off" role="status"><span class="dot"></span><span id="statusText">Не подключено</span></span>
      <button id="connectBtn" type="button" class="btn primary">Подключить</button>
    </div>
  </header>

  <div id="noSerial" class="banner" hidden>Этот браузер не поддерживает Web Serial. Откройте страницу в Chrome или Edge.</div>

  <main>
    <div class="left">

      <section class="card readout" id="readout" aria-label="Мощность">
        <span class="caps">Мощность</span>
        <div class="row">
          <div class="value idle" id="valueBox">
            <span id="num" class="num idle">------</span>
            <span id="unit" class="unit">W</span>
          </div>
          <button id="copyBtn" type="button" class="icon-btn" aria-label="Копировать текущее значение" title="Копировать значение (Ctrl+C)">
            <svg id="icoCopy" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            <svg id="icoDone" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M5 12l5 5L20 7"/></svg>
          </button>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px">
          <div class="frac-head"><span id="fracLabel">Доля шкалы</span><span id="fracText">--.- %</span></div>
          <div class="bar"><div id="fracBar"></div></div>
        </div>
      </section>

      <section class="card controls" aria-label="Диапазон">
        <label class="label" for="rangeNum">Range</label>
        <div class="range-row">
          <input id="rangeNum" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-describedby="rangeHint">
          <div class="seg mono" role="group" aria-label="Единицы диапазона" id="unitSeg">
            <button type="button" data-unit="W" aria-pressed="false">W</button>
            <button type="button" data-unit="mW" aria-pressed="false">mW</button>
            <button type="button" data-unit="uW" aria-pressed="false">µW</button>
          </div>
          <button id="applyBtn" type="button" class="btn primary" aria-label="Применить диапазон (Enter)" title="Применить (Enter), отменить — Esc">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
          </button>
        </div>
        <p class="hint" id="rangeHint"></p>
      </section>

      <section class="card record" aria-label="Запись в файл">
        <span class="label">Запись в файл</span>
        <div class="field">
          <label for="fname">Файл CSV</label>
          <div class="file-row">
            <input id="fname" type="text" spellcheck="false" readonly title="Имя меняется через «Выбрать…»">
            <button id="pickBtn" type="button" class="btn">Выбрать…</button>
          </div>
        </div>
        <button id="recBtn" type="button" class="rec-btn"><span class="mark"></span><span id="recText">Начать запись</span></button>
      </section>
    </div>

    <section class="card chart-card" aria-label="График">
      <div class="chart-head">
        <span class="label">Мощность, <span id="chartUnit">mW</span></span>
        <div class="chart-tools">
          <div class="pair">
            <span class="ctl-label" id="scaleLbl">Шкала</span>
            <div class="seg" role="group" aria-labelledby="scaleLbl" id="scaleSeg">
              <button type="button" data-scale="range" aria-pressed="true">Range</button>
              <button type="button" data-scale="auto" aria-pressed="false">Auto</button>
            </div>
          </div>
          <div class="pair">
            <span class="ctl-label" id="winLbl">Время</span>
            <div class="seg" role="group" aria-labelledby="winLbl" id="winSeg">
              <button type="button" data-win="30" aria-pressed="true">30 с</button>
              <button type="button" data-win="300" aria-pressed="false">5 мин</button>
              <button type="button" data-win="0" aria-pressed="false">Всё</button>
            </div>
          </div>
        </div>
      </div>
      <div class="plot" id="plot">
        <canvas id="cv" role="img" aria-label="График мощности по времени"></canvas>
        <div class="empty" id="plotEmpty">Нет данных</div>
      </div>
    </section>
  </main>

  <footer>
    <span id="fLast">Arduino: -.------ W · range --</span>
    <span id="fRate">0 строк/с</span>
    <span id="fBad">битых строк: 0</span>
    <span id="fErr" class="err"></span>
  </footer>
</div>

<script>
'use strict';
/*
  Nova Logger — страница для Arduino Nano, читающей аналоговый выход Ophir Nova.

  Путь данных:
    порт (Web Serial) → строки → разбор → состояние S → { число на экране, график, файл CSV }

  Arduino только измеряет и шлёт напряжение выхода Nova (протокол — в начале nova_logger.ino):
    от Arduino:  V,<напряжение В> 10 раз в секунду;  S — среднее сброшено;  T,… — режим теста millis
    к Arduino:   S — сбросить скользящее среднее (шкалу переключили)
  Всё остальное считается здесь: мощность = напряжение / V_FULL × шкала. Шкала вводится
  на странице целым числом и единицами (300 µW, 5 W) и запоминается браузером.

  Разделы ниже идут в том же порядке:
    1. Настройки          — все числа, которые имеет смысл крутить
    2. Чистые функции      — формат числа, разбор строки, строка CSV; страницу не трогают
    3. Состояние           — всё, что программа знает в данный момент
    4. Порт                — подключение, чтение строк, отправка команды сброса
    5. Входящие строки     — напряжение → мощность → экран, график, файл
    6. Шкала (range)       — поле «число + единицы» → Enter → сброс среднего в Arduino
    7. Копирование значения
    8. Запись в файл CSV
    9. Отображение         — число, кнопки, статус, подвал
   10. График
   11. Сохранённые настройки вида
   12. Кнопки и клавиши
   13. Запуск
*/

// =====================================================================
// 1. Настройки
// =====================================================================

const BAUD = 115200;

// Единицы: множитель из ваттов и подпись. Число на экране всегда в единицах текущей шкалы.
const UNITS = { W: { k: 1, label: 'W' }, mW: { k: 1e3, label: 'mW' }, uW: { k: 1e6, label: 'µW' } };

const V_FULL = 1.0;          // напряжение выхода Nova на полной шкале, В

// Допустимые шкалы, W — защита от опечаток
const RANGE_MIN_W = 1e-9, RANGE_MAX_W = 1000;

const ADC_FS = 1.1 / 1024 / V_FULL;   // шаг АЦП как доля полной шкалы (опора ≈1.1 В) — для числа знаков

// Время, мс
const STALE_MS          = 1500;   // столько без строк — «нет данных», число тускнеет
const BOOT_MS           = 2000;   // после открытия порта Nano перезагружается: мусор не считаем битым
const ERR_MS            = 10000;  // сколько держится сообщение об ошибке
const COPY_GAP_MS       = 250;    // копирование чаще не засчитывается
const OVER_FRAC         = 0.99;   // от этой доли шкалы число красное: Nova упирается в 1 В — зашкал
const NOTICE_MS         = 5000;   // напоминание «переключите Nova на …»
const RESET_RETRIES     = 6;      // попыток сбросить среднее, потом ошибка
const COMMIT_MS         = 5000;   // как часто фиксировать CSV на диске (потеря при сбое — не больше)

// График
const HEADROOM     = 0.10;    // запас шкалы по Y сверху и снизу, доля
const LAG_MS       = 150;     // правый край отстаёт от «сейчас», чтобы новые точки не выскакивали
const Y_TAU_MS     = 300;     // плавность подстройки шкалы Y (постоянная времени)
const GAP_MS       = 500;     // пауза между точками больше этой — линия прерывается
const MAX_POINTS   = 2000000; // точек в памяти; старые 10% выбрасываются
const PLOT_PAD     = { top: 8, right: 10, bottom: 28 };   // отступы области графика, px
const X_LABEL_PX   = 90;      // подписи времени не чаще, чем через столько пикселей
const Y_LABEL_PX   = 55;      // деления Y не чаще
const X_STEPS_S    = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400];

const PREFS_KEY = 'novaLogger.prefs';

// =====================================================================
// 2. Чистые функции
// =====================================================================

// Монотонное время: не прыгает при синхронизации системных часов, но отсчитано от того же нуля,
// что и обычное время, поэтому годится и для подписей оси.
const nowMs = () => performance.timeOrigin + performance.now();

// Знаков после точки: на два разряда мельче шага АЦП, но не меньше одного.
// Для 10A-BB-16 в mW это 2/1/1, как было; таблица для всех шкал — в README.
function decimals(fsW, unit) {
  const step = fsW * ADC_FS * UNITS[unit].k;
  return Math.max(1, 1 - Math.floor(Math.log10(step)));
}

// Мощность (W) → текст для экрана и копирования, без единиц
function formatPower(pW, unit, fsW) {
  if (pW == null || fsW == null) return null;
  return (pW * UNITS[unit].k).toFixed(decimals(fsW, unit));
}

// Самое длинное значение при данной шкале (сама полная шкала) — по нему подбирается шрифт
function widestValue(unit, fsW) {
  const fs = fsW ?? 1;
  return (fs * UNITS[unit].k).toFixed(decimals(fs, unit));
}

// Единицы шкалы: самые крупные, в которых она целое число ≥ 1.
// 0.0003 → µW (300), 0.5 → mW (500), 3 → W (3), 0.0025 → µW (2500).
function unitOf(fsW) {
  for (const u of ['W', 'mW', 'uW']) {
    const v = fsW * UNITS[u].k;
    if (v >= 1 - 1e-9 && Math.abs(v - Math.round(v)) < 1e-6 * v) return u;
  }
  return fsW >= 1 ? 'W' : fsW >= 1e-3 ? 'mW' : 'uW';   // нецелая шкала — по величине
}
const scaleValue = fsW => +(fsW * UNITS[unitOf(fsW)].k).toPrecision(6);
const scaleName  = fsW => scaleValue(fsW) + ' ' + UNITS[unitOf(fsW)].label;

// Ввод шкалы: целое число и единицы → ватты, или null, если ввод недопустим
function parseRangeInput(text, unit) {
  if (!/^\s*\d+\s*$/.test(text)) return null;
  const fs = parseInt(text, 10) / UNITS[unit].k;
  return fs >= RANGE_MIN_W && fs <= RANGE_MAX_W ? fs : null;
}

// Прочерки, пока значения нет: всегда одинаковое число, не зависит от единиц и range
const PLACEHOLDER = '------';

// Строка от Arduino → объект, или null, если строка не по протоколу
const RE_V = /^V,(-?\d+(?:\.\d+)?)$/;
function parseLine(line) {
  const m = RE_V.exec(line);
  if (m) return { type: 'V', v: parseFloat(m[1]) };
  if (line === 'S') return { type: 'S' };            // Arduino сбросил среднее
  if (line.startsWith('T,')) return { type: 'T' };   // режим теста millis — не данные, но и не мусор
  return null;
}

// Напряжение (В) → мощность (W) при данной шкале
const toPower = (v, fsW) => fsW == null ? null : v / V_FULL * fsW;

// CSV: две строки заголовка (имена и единицы — Origin берёт их в Long Name и Units),
// затем по строке на каждое измерение
// Напряжение пишется всегда: если шкала была выставлена неверно, мощность пересчитывается
// из него задним числом. Пока шкала не задана, P и range пустые.
const CSV_HEADER = 't,V,P,range,copy\ns,V,W,W,\n';
// V — 6 знаков, как от Arduino; P — 9 знаков (шаг АЦП на 300 µW ≈ 0.3 µW); шкала — как есть: 0.0003, 0.5
const csvRow = (tSec, v, pW, fsW, copied) =>
  tSec.toFixed(3) + ',' + v.toFixed(6) + ',' + (pW == null ? '' : pW.toFixed(9)) + ','
  + (fsW == null ? '' : +fsW.toPrecision(6)) + ',' + (copied ? '1' : '') + '\n';

function defaultFileName() {
  const d = new Date(), z = n => String(n).padStart(2, '0');
  return 'nova_' + d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + '_'
       + z(d.getHours()) + '-' + z(d.getMinutes()) + '-' + z(d.getSeconds()) + '.csv';
}

// «Круглый» шаг делений (1, 2, 5 × 10^k), чтобы на отрезке span было около n делений
function niceStep(span, n) {
  const raw = span / Math.max(1, n), p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}

// Первый индекс в отсортированном массиве, где a[i] >= x
function lowerBound(a, x) {
  let lo = 0, hi = a.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] < x) lo = m + 1; else hi = m; }
  return lo;
}

const pad2 = n => String(n).padStart(2, '0');
const hms = t => { const d = new Date(t); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); };

// =====================================================================
// 3. Состояние
// =====================================================================

const S = {
  // порт
  port: null, reader: null, readDone: null, writer: null, writeDone: null,
  connected: false, connT: 0,

  // последнее значение
  lastV: null,         // напряжение от Arduino, В
  last: null,          // мощность, W (null, пока шкала не задана)
  lastT: 0,            // когда пришла последняя строка

  // шкала
  fs: null,            // полная шкала, W — задаётся на странице и запоминается
  draft: null,         // поле range правится: { text, unit }; null — показывает текущую шкалу
  noticeUntil: 0,
  resetPending: false, // шкалу сменили, Arduino ещё не подтвердил сброс среднего
  resetTries: 0,

  // вид
  scale: 'range', winSec: 30,

  // данные графика: время и мощность, плюс секундные min/max для длинных окон
  t: [], p: [], copies: [],
  bk: { t: [], mn: [], mx: [] },

  // подвал
  rate: 0, rateCount: 0, bad: 0, err: '', errUntil: 0,

  // запись
  rec: { active: false, handle: null, writable: null, t0: 0, rows: 0, buf: '', copyFlag: false,
         chain: Promise.resolve(), timer: null }
};

const $ = id => document.getElementById(id);
const isStale = () => S.connected && nowMs() - S.lastT > STALE_MS;

function setErr(msg) {
  S.err = msg; S.errUntil = nowMs() + ERR_MS;
  setTimeout(markDirty, ERR_MS + 50);
  markDirty();
}

// =====================================================================
// 4. Порт
// =====================================================================

async function connect() {
  try { S.port = await navigator.serial.requestPort(); }
  catch (e) { return; }                                   // окно выбора закрыли
  try { await S.port.open({ baudRate: BAUD }); }
  catch (e) { setErr('Не удалось открыть порт: ' + e.message); return; }

  S.connected = true; S.connT = S.lastT = nowMs();
  S.err = ''; S.bad = 0;
  S.lastV = S.last = null;
  S.resetPending = false;                                 // Nano перезагружается при открытии порта — среднее и так чистое
  clearChart();                                           // старый сеанс на графике не нужен

  const enc = new TextEncoderStream();
  S.writeDone = enc.readable.pipeTo(S.port.writable);
  S.writer = enc.writable.getWriter();
  readLoop();
  markDirty();
}

async function disconnect() {
  if (S.rec.active) await stopRec();
  S.connected = false;
  try { if (S.reader) await S.reader.cancel(); } catch (e) {}
  try { await S.readDone; } catch (e) {}
  try { if (S.writer) await S.writer.close(); } catch (e) {}
  try { await S.writeDone; } catch (e) {}
  try { await S.port.close(); } catch (e) {}
  S.reader = S.writer = S.port = null;
  S.resetPending = false;
  S.lastV = S.last = null;                                // после отключения число не выдаём за живое
  markDirty();
}

// Читает порт, режет поток на строки по \n и отдаёт каждую в handleLine
async function readLoop() {
  const dec = new TextDecoderStream();
  S.readDone = S.port.readable.pipeTo(dec.writable);
  S.reader = dec.readable.getReader();
  let buf = '';
  try {
    while (true) {
      const { value, done } = await S.reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).replace(/\r$/, '');
        buf = buf.slice(i + 1);
        handleLine(line, nowMs());
      }
      if (buf.length > 256) { buf = ''; countBad(); }    // нет конца строки — мусор
    }
  } catch (e) {
    if (S.connected) setErr('Порт отключился: ' + e.message);
  } finally {
    try { S.reader.releaseLock(); } catch (e) {}
    if (S.connected) disconnect();
  }
}

async function send(cmd) {
  if (!S.writer) return;
  try { await S.writer.write(cmd + '\n'); }
  catch (e) { setErr('Ошибка отправки: ' + e.message); }
}

// =====================================================================
// 5. Входящие строки
// =====================================================================

function handleLine(line, t) {
  if (line === '') return;
  const m = parseLine(line);
  if (!m) countBad();
  else if (m.type === 'V') onData(m.v, t);
  else if (m.type === 'S') onResetDone();
  markDirty();
}

// первая строка после перезагрузки Nano почти всегда обрезана — это не сбой связи
function countBad() { if (nowMs() - S.connT > BOOT_MS) S.bad++; }

function onData(v, t) {
  S.lastV = v; S.lastT = t; S.rateCount++;
  S.last = toPower(v, S.fs);
  // пока Arduino не сбросил среднее, в нём смешаны старая и новая шкала — на график не рисуем
  if (S.last != null && !S.resetPending) addPoint(t, S.last);
  if (S.rec.active) writeRow(t, v, S.last, S.fs);
  // строка V только что пришла — Arduino сейчас не спит, это безопасный момент для команды
  if (S.resetPending) sendReset();
}

function sendReset() {
  if (S.resetTries >= RESET_RETRIES) {
    S.resetPending = false;
    setErr('Arduino не подтвердил сброс среднего');
    return;
  }
  S.resetTries++;
  send('S');
}

// Arduino сбросил среднее: дальше значения чистые, график начинается с этого момента
function onResetDone() {
  if (!S.resetPending) return;
  S.resetPending = false;
  clearChart();
}

// =====================================================================
// 6. Шкала (range)
// =====================================================================
// Поле range — черновик: число и единицы правятся свободно (подсвечены пунктиром) и
// применяются только по Enter или ✓; Esc возвращает текущую шкалу. Так случайный клик по
// единицам не меняет шкалу в 1000 раз. Arduino о шкале не знает — получает только команду сброса.

// Единицы на экране — единицы текущей шкалы; пока шкала не задана — W
const dispUnit = () => S.fs == null ? 'W' : unitOf(S.fs);

const currentUnit = () => S.draft ? S.draft.unit : unitOf(S.fs ?? 1);

function editDraft(text, unit) {
  S.draft = { text: text ?? (S.draft ? S.draft.text : $('rangeNum').value), unit: unit ?? currentUnit() };
  markDirty();
}

function cancelDraft() { S.draft = null; markDirty(); }

function applyDraft() {
  if (!S.draft) return;
  const fs = parseRangeInput(S.draft.text, S.draft.unit);
  if (fs == null) return;                                 // поле уже красное, подсказка объясняет
  S.draft = null;
  setRange(fs);
}

// Новая шкала: Arduino сбрасывает среднее (иначе секунду в нём смешаны старое и новое
// напряжение), график начинается заново, появляется напоминание переключить саму Nova.
// Порядок для пользователя: сначала переключить Nova, потом Enter. Запись в файл идёт без перерыва.
function setRange(fs) {
  if (fs !== S.fs) {
    S.fs = fs;
    savePrefs();
    clearChart();
    if (S.connected) { S.resetPending = true; S.resetTries = 0; }
    S.last = S.lastV == null ? null : toPower(S.lastV, fs);
    S.noticeUntil = nowMs() + NOTICE_MS;
    setTimeout(markDirty, NOTICE_MS + 50);
  }
  markDirty();
}

// =====================================================================
// 7. Копирование значения
// =====================================================================
// Копирует число ровно как на экране, без единиц. Момент копирования отмечается пунктиром
// на графике и единицей в колонке copy ближайшей строки файла.

let lastCopyT = 0, copyIconTimer = null;

async function copyValue() {
  const text = formatPower(S.last, dispUnit(), S.fs);
  if (text == null || isStale()) return;
  const t = nowMs();
  if (t - lastCopyT < COPY_GAP_MS) return;
  lastCopyT = t;

  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {                                             // запасной способ, если API недоступен
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
  }
  if (!ok) { setErr('Не удалось скопировать'); return; }

  S.copies.push(t);
  if (S.rec.active) S.rec.copyFlag = true;

  // иконка на полторы секунды меняется на галочку
  $('icoCopy').hidden = true; $('icoDone').hidden = false; $('copyBtn').classList.add('done');
  clearTimeout(copyIconTimer);
  copyIconTimer = setTimeout(() => {
    $('icoCopy').hidden = false; $('icoDone').hidden = true; $('copyBtn').classList.remove('done');
  }, 1500);
  markDirty();
}

// =====================================================================
// 8. Запись в файл CSV
// =====================================================================
// Строки копятся в буфере и раз в COMMIT_MS сбрасываются в файл. Chrome переносит данные
// в сам файл только при закрытии, поэтому при каждом сбросе файл закрывается и открывается
// заново на дозапись: на диске всегда данные не старше COMMIT_MS.

async function pickFile() {
  if (!window.showSaveFilePicker) { setErr('Браузер не умеет сохранять файлы напрямую'); return false; }
  try {
    S.rec.handle = await window.showSaveFilePicker({
      suggestedName: $('fname').value || defaultFileName(),
      types: [{ description: 'CSV', accept: { 'text/csv': ['.csv'] } }]
    });
    $('fname').value = S.rec.handle.name;
    return true;
  } catch (e) { return false; }                          // окно закрыли
}

async function startRec() {
  const r = S.rec;
  if (!S.connected) return;
  if (!r.handle && !(await pickFile())) return;
  try {
    r.writable = await r.handle.createWritable();
    await r.writable.write(CSV_HEADER);
  } catch (e) { setErr('Не удалось открыть файл: ' + e.message); return; }
  Object.assign(r, { active: true, t0: nowMs(), rows: 0, buf: '', copyFlag: false });
  S.err = ''; S.errUntil = 0;
  r.timer = setInterval(() => { queue(commit); markDirty(); }, COMMIT_MS);
  markDirty();
}

async function stopRec() {
  const r = S.rec;
  if (!r.active) return;
  r.active = false;
  clearInterval(r.timer);
  await queue(commit);
  r.handle = null;                                        // следующая запись — в новый файл
  $('fname').value = defaultFileName();
  markDirty();
}

function writeRow(t, v, pW, fs) {
  const r = S.rec;
  r.buf += csvRow((t - r.t0) / 1000, v, pW, fs, r.copyFlag);
  r.copyFlag = false;
  r.rows++;
}

// Операции с файлом идут строго по очереди
function queue(fn) {
  S.rec.chain = S.rec.chain.then(fn).catch(failRec);
  return S.rec.chain;
}

async function commit() {
  const r = S.rec;
  if (!r.writable) return;
  if (r.buf) {
    const chunk = r.buf; r.buf = '';
    try { await r.writable.write(chunk); }
    catch (e) { r.buf = chunk + r.buf; throw e; }         // строки возвращаются в буфер
  }
  await r.writable.close();
  if (!r.active) { r.writable = null; return; }
  const size = (await r.handle.getFile()).size;
  r.writable = await r.handle.createWritable({ keepExistingData: true });
  await r.writable.seek(size);
}

// Файл недоступен (диск, флешка, права): запись останавливается явно, а не теряет строки молча
function failRec(e) {
  const r = S.rec;
  r.active = false;
  clearInterval(r.timer);
  try { if (r.writable) r.writable.abort(); } catch (e2) {}
  r.writable = null; r.handle = null;
  const lost = (r.buf.match(/\n/g) || []).length;
  r.buf = '';
  S.err = 'Запись остановлена: файл недоступен (' + e.message + ')' + (lost ? '. Не записано строк: ' + lost : '');
  S.errUntil = Infinity;                                  // не гаснет, пока не начнётся новая запись
  $('fname').value = defaultFileName();
  markDirty();
}

// =====================================================================
// 9. Отображение
// =====================================================================
// render() переписывает всё на странице из состояния S. Вызывается не чаще кадра экрана
// через markDirty(); график рисуется отдельно (раздел 10).

let dirty = false;
function markDirty() {
  if (!dirty) { dirty = true; requestAnimationFrame(render); }
  kickChart();
}

function render() {
  dirty = false;
  renderReadout();
  renderControls();
  renderStatus();
  renderRecord();
  renderFooter();
}

function renderReadout() {
  const stale = isStale();
  const unit = dispUnit();
  const txt = formatPower(S.last, unit, S.fs);
  $('num').textContent = txt ?? PLACEHOLDER;
  $('num').classList.toggle('idle', txt == null);
  $('valueBox').classList.toggle('idle', txt == null);
  $('readout').classList.toggle('stale', stale && txt != null);
  $('readout').classList.toggle('over', S.last != null && S.fs != null && S.last >= OVER_FRAC * S.fs);
  $('copyBtn').disabled = txt == null || stale;
  $('unit').textContent = UNITS[unit].label;
  $('chartUnit').textContent = UNITS[unit].label;
  fitNumber();

  if (S.fs != null && S.last != null) {
    const pct = S.last / S.fs * 100;
    $('fracLabel').textContent = 'Доля шкалы ' + scaleName(S.fs);
    $('fracText').textContent = pct >= OVER_FRAC * 100 ? 'зашкал — увеличьте range' : pct.toFixed(pct < 1 ? 2 : 1) + ' %';
    $('fracBar').style.width = Math.max(0, Math.min(100, pct)).toFixed(2) + '%';
  } else {
    $('fracLabel').textContent = 'Доля шкалы';
    $('fracText').textContent = '--.- %';
    $('fracBar').style.width = '0';
  }
}

// Размер шрифта числа подбирается один раз по самому длинному значению для текущих единиц
// и range, а не по текущему значению — поэтому шрифт не прыгает, когда меняется число цифр.
let fitKey = '';
function fitNumber(force) {
  const num = $('num'), box = $('valueBox');
  const widest = widestValue(dispUnit(), S.fs);
  const key = widest + '|' + box.clientWidth;
  if (key === fitKey && !force) return;
  fitKey = key;
  const shown = num.textContent;
  num.style.fontSize = '68px'; num.textContent = widest;
  const w68 = num.scrollWidth;
  num.textContent = shown;
  const avail = box.clientWidth - $('unit').offsetWidth - 10;
  num.style.fontSize = Math.max(28, Math.min(68, Math.floor(68 * avail / w68))) + 'px';
}

function renderControls() {
  for (const b of $('scaleSeg').children) b.setAttribute('aria-pressed', String(b.dataset.scale === S.scale));
  for (const b of $('winSeg').children) b.setAttribute('aria-pressed', String(+b.dataset.win === S.winSec));
  renderRange();
}

// Поле range: черновик, если правится; иначе применённая (ждёт ответа) или текущая шкала
function renderRange() {
  const input = $('rangeNum');
  const fsDraft = S.draft ? parseRangeInput(S.draft.text, S.draft.unit) : null;
  const invalid = S.draft != null && fsDraft == null;
  if (!S.draft) input.value = S.fs == null ? '' : scaleValue(S.fs);
  input.classList.toggle('draft', S.draft != null && !invalid);
  input.classList.toggle('invalid', invalid);

  const unit = currentUnit();
  for (const b of $('unitSeg').children) {
    b.setAttribute('aria-pressed', String(b.dataset.unit === unit));
    b.classList.toggle('draft', S.draft != null);
  }
  $('applyBtn').disabled = fsDraft == null;

  const hint = $('rangeHint');
  const notice = S.fs != null && nowMs() < S.noticeUntil && !S.draft;
  hint.classList.toggle('notice', notice || invalid || S.fs == null);
  if (invalid) hint.textContent = 'Нужно целое число; шкала от 1 nW до 1000 W.';
  else if (S.draft) hint.textContent = 'Enter или ✓ — применить ' + scaleName(fsDraft) + ', Esc — отменить.';
  else if (notice) hint.textContent = 'Переключите Nova на ' + scaleName(S.fs) + '.'
    + (S.resetPending ? ' Сбрасываю среднее…' : '');
  else if (S.fs != null) hint.textContent = 'Шаг АЦП ≈ ' + scaleName(+(S.fs * ADC_FS).toPrecision(2))
    + '. На Nova должна стоять та же шкала.';
  else hint.textContent = 'Введите шкалу, как на Nova: целое число и единицы, например 300 µW.';
}

function renderStatus() {
  const st = $('status');
  let cls = 'on', text = 'Подключено';
  if (!S.connected) { cls = 'off'; text = 'Не подключено'; }
  else if (isStale()) { cls = 'warn'; text = 'Подключено · нет данных'; }
  st.className = 'status ' + cls;
  $('statusText').textContent = text;
  st.title = text;
  $('connectBtn').textContent = S.connected ? 'Отключить' : 'Подключить';
  $('connectBtn').className = S.connected ? 'btn' : 'btn primary';
}

function renderRecord() {
  const r = S.rec;
  $('recBtn').classList.toggle('active', r.active);
  $('recBtn').disabled = !r.active && !S.connected;       // без подключения писать нечего
  if (r.active) {
    const sec = Math.floor((nowMs() - r.t0) / 1000);
    $('recText').textContent = 'Остановить · ' + pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60)
      + ' · ' + r.rows.toLocaleString('ru-RU') + ' строк';
  } else {
    $('recText').textContent = 'Начать запись';
  }
  $('fname').disabled = r.active;
  $('fname').classList.toggle('suggested', !r.handle);    // серое имя — файл ещё не выбран
  $('pickBtn').disabled = r.active;
}

function renderFooter() {
  $('fLast').textContent = 'Arduino: ' + (S.lastV == null ? '-.------' : S.lastV.toFixed(6)) + ' V · range '
    + (S.fs == null ? '--' : scaleName(S.fs));
  $('fRate').textContent = S.rate + ' строк/с';
  $('fBad').textContent = 'битых строк: ' + S.bad;
  $('fErr').textContent = nowMs() < S.errUntil ? S.err : '';
}

// =====================================================================
// 10. График
// =====================================================================
// Рисуется на холсте непрерывно (~60 кадров/с), пока порт открыт: окно по времени едет плавно,
// а не скачками по 100 мс. Каждый кадр: окно времени → шкала Y → сетка и подписи → отметки → линия.

const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;      // размер холста в CSS-пикселях
let C = {};            // цвета из текущей темы
const Yscale = { lo: 0, hi: 1, init: false, ts: 0 };   // текущие (сглаженные) границы Y, W

function addPoint(t, pW) {
  S.t.push(t); S.p.push(pW);
  // секундная корзина min/max — для окна «Всё» на многочасовой записи
  const bk = S.bk, b = Math.floor(t / 1000) * 1000, j = bk.t.length - 1;
  if (j >= 0 && bk.t[j] === b) { if (pW < bk.mn[j]) bk.mn[j] = pW; if (pW > bk.mx[j]) bk.mx[j] = pW; }
  else { bk.t.push(b); bk.mn.push(pW); bk.mx.push(pW); }
  if (S.t.length > MAX_POINTS) {
    const k = MAX_POINTS / 10;
    S.t.splice(0, k); S.p.splice(0, k);
    const cut = lowerBound(bk.t, Math.floor(S.t[0] / 1000) * 1000);
    bk.t.splice(0, cut); bk.mn.splice(0, cut); bk.mx.splice(0, cut);
  }
}

function clearChart() {
  S.t = []; S.p = []; S.copies = [];
  S.bk = { t: [], mn: [], mx: [] };
  Yscale.init = false;
}

function resizeCanvas() {
  const r = $('plot').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  kickChart();
}

function readTheme() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  C = { grid: v('--grid'), axis: v('--axis'), label: v('--muted'), marker: v('--marker'),
        line: v('--plot-line'), font: '12px ' + v('--mono') };
}

// Цикл кадров: крутится, пока порт открыт или шкала Y ещё доезжает до цели
let chartLoop = false;
function kickChart() { if (!chartLoop) { chartLoop = true; requestAnimationFrame(chartFrame); } }
function chartFrame(ts) {
  const moving = drawChart(ts);
  if ((S.connected && !document.hidden) || moving) requestAnimationFrame(chartFrame);
  else chartLoop = false;
}

// Окно по времени. Начинается с первой точки: пока данных меньше окна, ось стоит, а линия
// растёт слева направо; когда окно заполнилось — всё плавно едет влево.
function timeWindow(n) {
  const now = S.connected ? nowMs() - LAG_MS : S.t[n - 1];
  if (!S.winSec) return [S.t[0], Math.max(now, S.t[0] + 1000)];   // «Всё»
  const win = S.winSec * 1000;
  return now - S.t[0] < win ? [S.t[0], S.t[0] + win] : [now - win, now];
}

// Целевые границы Y в ваттах; fs — полная шкала (только в режиме Range)
function targetY(i0, n) {
  if (S.scale === 'range' && S.fs != null) {
    const fs = S.fs;
    return { lo: -HEADROOM * fs, hi: (1 + HEADROOM) * fs, fs };
  }
  let mn = Infinity, mx = -Infinity;
  for (let i = i0; i < n; i++) { const v = S.p[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
  const pad = mx > mn ? (mx - mn) * HEADROOM : Math.max(Math.abs(mx) * 0.05, 1e-9);
  return { lo: mn - pad, hi: mx + pad, fs: null };
}

// Плавное движение границ Y к цели. Возвращает true, пока ещё едет.
function smoothY(target, ts) {
  const dt = Yscale.ts ? Math.min(200, ts - Yscale.ts) : 0;
  Yscale.ts = ts;
  if (!Yscale.init) { Yscale.lo = target.lo; Yscale.hi = target.hi; Yscale.init = true; return false; }
  const a = 1 - Math.exp(-dt / Y_TAU_MS);
  Yscale.lo += (target.lo - Yscale.lo) * a;
  Yscale.hi += (target.hi - Yscale.hi) * a;
  const tol = (target.hi - target.lo) * 1e-3;
  const moving = Math.abs(Yscale.lo - target.lo) > tol || Math.abs(Yscale.hi - target.hi) > tol;
  if (!moving) { Yscale.lo = target.lo; Yscale.hi = target.hi; }
  return moving;
}

function drawChart(ts) {
  if (!W || !H) return false;
  ctx.clearRect(0, 0, W, H);
  const n = S.t.length;
  $('plotEmpty').hidden = n > 0;
  if (!n) { Yscale.init = false; return false; }

  const k = UNITS[dispUnit()].k;                          // ватты → единицы экрана
  const [tStart, tEnd] = timeWindow(n);
  const i0 = Math.max(0, lowerBound(S.t, tStart) - 1);
  const target = targetY(i0, n);
  const moving = smoothY(target, ts);
  const lo = Yscale.lo * k, hi = Yscale.hi * k, fs = target.fs;

  // деления Y; в режиме Range подписи только от 0 до полной шкалы
  const T = PLOT_PAD.top, ph = H - PLOT_PAD.top - PLOT_PAD.bottom;
  const tickLo = fs != null ? 0 : lo, tickHi = fs != null ? fs * k : hi;
  const yStep = niceStep(tickHi - tickLo, Math.max(2, Math.floor(ph / Y_LABEL_PX)));
  const yDec = Math.max(0, -Math.floor(Math.log10(yStep) + 1e-9));
  ctx.font = C.font;
  const yTicks = [];
  let labW = 0;
  for (let v = Math.ceil(tickLo / yStep - 1e-9) * yStep; v <= tickHi + yStep * 1e-6; v += yStep) {
    if (v < lo || v > hi) continue;
    const s = (Math.abs(v) < yStep * 1e-6 ? 0 : v).toFixed(yDec);
    yTicks.push([v, s]); labW = Math.max(labW, ctx.measureText(s).width);
  }

  // область графика: слева место под подписи Y
  const L = Math.ceil(labW) + 14, pw = W - L - PLOT_PAD.right;
  if (pw < 20 || ph < 20) return moving;
  const X = t => L + (t - tStart) / (tEnd - tStart) * pw;
  const Y = v => T + (1 - (v - lo) / (hi - lo || 1)) * ph;

  drawYGrid(yTicks, Y, L, pw);
  drawXGrid(tStart, tEnd, X, L, pw, T, ph);

  ctx.save();
  ctx.beginPath(); ctx.rect(L + 1, T, pw - 1, ph); ctx.clip();
  drawMarkers(fs, k, tStart, tEnd, X, Y, L, pw, T, ph);
  drawLine(i0, n, k, tStart, X, Y, pw);
  ctx.restore();
  return moving;
}

function drawYGrid(yTicks, Y, L, pw) {
  ctx.lineWidth = 1; ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
  for (const [v, s] of yTicks) {
    const y = Math.round(Y(v)) + 0.5;
    ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke();
    ctx.fillStyle = C.label; ctx.fillText(s, L - 8, y);
  }
}

// Деления времени: «круглый» шаг из X_STEPS_S, не чаще одной подписи на X_LABEL_PX,
// выровнены по местному времени. Подпись у края сдвигается внутрь.
function drawXGrid(tStart, tEnd, X, L, pw, T, ph) {
  const maxTicks = Math.max(1, Math.floor(pw / X_LABEL_PX));
  const spanS = (tEnd - tStart) / 1000;
  const xs = X_STEPS_S.find(s => spanS / s <= maxTicks) * 1000 || 86400000;
  const tz = -new Date().getTimezoneOffset() * 60000;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let t = Math.ceil((tStart + tz) / xs) * xs - tz; t <= tEnd; t += xs) {
    const x = Math.round(X(t)) + 0.5;
    ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + ph); ctx.stroke();
    ctx.fillStyle = C.label; ctx.fillText(hms(t), Math.min(Math.max(x, L + 30), L + pw - 30), T + ph + 8);
  }
  ctx.strokeStyle = C.axis;
  ctx.beginPath(); ctx.moveTo(L + 0.5, T); ctx.lineTo(L + 0.5, T + ph + 0.5); ctx.lineTo(L + pw, T + ph + 0.5); ctx.stroke();
}

// Пунктиры: горизонтальный — полная шкала (режим Range), вертикальные — моменты копирования
function drawMarkers(fs, k, tStart, tEnd, X, Y, L, pw, T, ph) {
  ctx.strokeStyle = C.marker; ctx.lineWidth = 1;
  if (fs != null) {
    const y = Math.round(Y(fs * k)) + 0.5;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke();
  }
  ctx.setLineDash([3, 4]);
  for (const t of S.copies) {
    if (t < tStart || t > tEnd) continue;
    const x = Math.round(X(t)) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + ph); ctx.stroke();
  }
  ctx.setLineDash([]);
}

// Линия мощности. До 2 точек на пиксель — рисуем как есть. Больше — по столбцам пикселей
// (min и max в каждом), а на очень длинных окнах — по секундным корзинам. Пауза больше
// GAP_MS — линия прерывается.
function drawLine(i0, n, k, tStart, X, Y, pw) {
  ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath();
  const count = n - i0;
  if (count <= pw * 2) {
    for (let i = i0; i < n; i++) {
      const x = X(S.t[i]), y = Y(S.p[i] * k);
      if (i === i0 || S.t[i] - S.t[i - 1] > GAP_MS) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  } else {
    const useBk = count > pw * 20;
    const tt = useBk ? S.bk.t : S.t, aMn = useBk ? S.bk.mn : S.p, aMx = useBk ? S.bk.mx : S.p;
    const j0 = useBk ? Math.max(0, lowerBound(tt, tStart) - 1) : i0;
    const off = useBk ? 500 : 0;                          // точка корзины — середина её секунды
    const gap = useBk ? 1000 + GAP_MS : GAP_MS;           // соседние корзины отстоят на 1 с
    let col = -1, mn = 0, mx = 0, brk = true;
    const flush = () => {
      if (col < 0) return;
      const y1 = Y(mn * k), y2 = Y(mx * k);
      if (brk) { ctx.moveTo(col, y1); brk = false; } else ctx.lineTo(col, y1);
      ctx.lineTo(col, y2);
    };
    for (let j = j0; j < tt.length; j++) {
      const c = Math.round(X(tt[j] + off));
      const jump = j > j0 && tt[j] - tt[j - 1] > gap;
      if (c !== col || jump) { flush(); if (jump) brk = true; col = c; mn = aMn[j]; mx = aMx[j]; }
      else { if (aMn[j] < mn) mn = aMn[j]; if (aMx[j] > mx) mx = aMx[j]; }
    }
    flush();
  }
  ctx.stroke();
}

// =====================================================================
// 11. Сохранённые настройки вида
// =====================================================================
// Шкала (range), режим графика и окно времени переживают перезагрузку страницы. Если хранилище браузера
// недоступно — просто работаем с умолчаниями.

function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
    if (p.scale === 'range' || p.scale === 'auto') S.scale = p.scale;
    if ([0, 30, 300].includes(p.winSec)) S.winSec = p.winSec;
    if (typeof p.fs === 'number' && p.fs >= RANGE_MIN_W && p.fs <= RANGE_MAX_W) S.fs = p.fs;
  } catch (e) {}
}
function savePrefs() {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify({ fs: S.fs, scale: S.scale, winSec: S.winSec })); } catch (e) {}
}

// =====================================================================
// 12. Кнопки и клавиши
// =====================================================================

// Одна операция за раз: двойной клик не откроет порт дважды и не начнёт две записи
function once(fn) {
  let busy = false;
  return async () => { if (busy) return; busy = true; try { await fn(); } finally { busy = false; } };
}

// Клик по кнопке внутри группы переключателей → fn(кнопка)
const onSeg = (id, fn) => { $(id).onclick = e => { const b = e.target.closest('button'); if (b) fn(b); }; };

$('connectBtn').onclick = once(() => (S.connected ? disconnect() : connect()));
$('copyBtn').onclick = copyValue;

onSeg('scaleSeg', b => { S.scale = b.dataset.scale;  savePrefs(); markDirty(); });
onSeg('winSeg',   b => { S.winSec = +b.dataset.win;  savePrefs(); markDirty(); });
// Поле range: ввод — черновик, Enter / ✓ — применить, Esc — отменить
onSeg('unitSeg', b => { editDraft(undefined, b.dataset.unit); $('rangeNum').focus(); });
$('rangeNum').addEventListener('input', e => editDraft(e.target.value));
$('rangeNum').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); applyDraft(); }
  else if (e.key === 'Escape') { e.preventDefault(); cancelDraft(); }
});
$('applyBtn').onclick = applyDraft;
const pick = once(async () => { await pickFile(); markDirty(); });
$('pickBtn').onclick = pick;
$('fname').onclick = () => { if (!S.rec.active) pick(); };
$('recBtn').onclick = once(() => (S.rec.active ? stopRec() : startRec()));

// Ctrl+C копирует значение, если на странице ничего не выделено и курсор не в поле ввода.
// Проверяется физическая клавиша, поэтому работает и в русской раскладке.
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey || e.code !== 'KeyC' || e.repeat) return;
  if (String(document.getSelection() || '') !== '') return;
  const a = document.activeElement;
  if (a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !a.readOnly))) return;
  e.preventDefault();
  copyValue();
});

// закрытие вкладки во время записи — браузер переспросит
window.addEventListener('beforeunload', e => { if (S.rec.active) { e.preventDefault(); e.returnValue = ''; } });

// =====================================================================
// 13. Запуск
// =====================================================================

// размеры: холст при изменении окна, шрифт числа при изменении карточки
new ResizeObserver(resizeCanvas).observe($('plot'));
new ResizeObserver(() => fitNumber()).observe($('valueBox'));
if (document.fonts) document.fonts.ready.then(() => { fitNumber(true); kickChart(); });

// окно перенесли на монитор с другим масштабом — пересоздать холст, иначе график мутный
(function watchDpr() {
  matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)')
    .addEventListener('change', () => { resizeCanvas(); watchDpr(); }, { once: true });
})();

// тема: при переключении светлой/тёмной перечитать цвета графика
readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); markDirty(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) kickChart(); });

// раз в секунду: счётчик строк/с, проверка «нет данных», таймер записи
setInterval(() => { S.rate = S.rateCount; S.rateCount = 0; markDirty(); }, 1000);

if (!('serial' in navigator)) {
  $('noSerial').hidden = false;
  $('connectBtn').disabled = true;
} else {
  navigator.serial.addEventListener('disconnect', e => {
    if (S.port && e.target === S.port) { setErr('USB отключён'); disconnect(); }
  });
}

loadPrefs();
$('fname').value = defaultFileName();
render();
kickChart();
</script>
</body>
</html>
